# Should be used in defaults list, e.g.
# - /driver: alpamayo15_1cam_local
# Type validation happens at driver runtime via OmegaConf.structured merge

defaults:
  - alpamayo1_5
  - /cameras: 1cam_1080
  - /extras: a15_weights
  - _self_

# Alpamayo 1.5 single-camera preset using local weights for single-view
# video-model runs.

inference:
  use_cameras:
    - camera_front_wide_120fov
  subsample_factor: 3

model:
  # Local pre-downloaded checkpoint (bind-mounted into the driver container).
  checkpoint_path: "/mnt/weights/alpamayo-1.5"
